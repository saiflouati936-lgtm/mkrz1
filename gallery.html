<body>

<header class="navbar">
  <a class="brand" href="index.html">
    <svg class="crest" viewBox="0 0 40 40"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#6f5cff" stroke-width="2"/><text x="20" y="26" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="16" fill="#f2f4fb">M</text></svg>
    MK<em>RZ</em>
  </a>
  <nav class="navlinks" id="navlinks">
    <a href="index.html">الرئيسية</a>
    <a class="active" href="gallery.html">المعرض</a>
    <a href="friends.html">الفريق</a>
  </nav>
  <div class="nav-cta">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="ابحث عن ملف...">
    </div>
    <div id="authSlot"></div>
  </div>
  <button class="nav-toggle" id="navToggle" aria-label="القائمة">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
</header>

<section class="toolbar">
  <div class="filters">
    <button class="filter active" data-filter="all">الكل</button>
    <button class="filter" data-filter="image">صور</button>
    <button class="filter" data-filter="video">فيديوهات</button>
  </div>
  <label class="upload">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    رفع صورة أو فيديو
    <input id="fileInput" type="file" accept="image/*,video/*" multiple hidden>
  </label>
</section>

<section class="gallery" id="gallery">
  <div class="empty-state">جارٍ تحميل الملفات...</div>
</section>

<footer>
  <span class="brand">MKRZ</span>
  <span>© 2026 MKRZ — جميع الحقوق محفوظة</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
